[phases.setup]
nixPkgs = ["python311Full", "nodejs_20"]

[phases.install]
cmds = ["cd backend && python3 -m ensurepip --upgrade && python3 -m pip install -r requirements.txt"]

[phases.build]
cmds = ["echo 'Backend ready'"]

[start]
cmd = "cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
